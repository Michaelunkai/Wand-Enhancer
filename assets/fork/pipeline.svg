<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" font-family="Segoe UI,Arial,sans-serif"><rect width="1280" height="560" fill="#0d1117"/><text x="40" y="52" font-size="30" font-weight="bold" fill="#e6edf3">Enhance pipeline — what this fork guarantees</text><rect x="40" y="90" width="285" height="110" rx="10" fill="#161b22" stroke="#58a6ff"/><text x="182" y="135" font-size="19" font-weight="bold" fill="#e6edf3" text-anchor="middle">Wand-Update-Run.ps1</text><text x="182" y="163" font-size="14" fill="#8b949e" text-anchor="middle">latest release → build</text><rect x="345" y="90" width="285" height="110" rx="10" fill="#161b22" stroke="#3fb950"/><text x="487" y="135" font-size="19" font-weight="bold" fill="#e6edf3" text-anchor="middle">reducer guard</text><text x="487" y="163" font-size="14" fill="#8b949e" text-anchor="middle">typeof account ⇒ no-op</text><rect x="650" y="90" width="285" height="110" rx="10" fill="#161b22" stroke="#58a6ff"/><text x="792" y="135" font-size="19" font-weight="bold" fill="#e6edf3" text-anchor="middle">binary gate</text><text x="792" y="163" font-size="14" fill="#8b949e" text-anchor="middle">refuse deploy w/o fix</text><rect x="955" y="90" width="285" height="110" rx="10" fill="#161b22" stroke="#3fb950"/><text x="1097" y="135" font-size="19" font-weight="bold" fill="#e6edf3" text-anchor="middle">headless enhance</text><text x="1097" y="163" font-size="14" fill="#8b949e" text-anchor="middle">12 patches → Done!</text><text x="640" y="245" font-size="44" fill="#8b949e" text-anchor="middle">↓  re-run over patched bundle  ↓</text><rect x="447" y="280" width="386" height="120" rx="10" fill="#161b22" stroke="#3fb950"/><text x="640" y="328" font-size="19" font-weight="bold" fill="#3fb950" text-anchor="middle">already wrapped?</text><text x="640" y="356" font-size="14" fill="#e6edf3" text-anchor="middle">resolve applied, never fail</text><rect x="247" y="430" width="786" height="90" rx="10" fill="#161b22" stroke="#30363d"/><text x="640" y="466" font-size="19" font-weight="bold" fill="#e6edf3" text-anchor="middle">Wand runs enhanced — fuse cleared, marker gone</text><text x="640" y="493" font-size="14" fill="#8b949e" text-anchor="middle">re-runs report “is patched”, no re-patch</text></svg>